<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive Profile Card</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: #121a33;
        --text: #e7ecf5;
        --muted: #9fb0d3;
        --accent: #6aa7ff;
        --ring: #94b8ff80;
        --gradient: linear-gradient(135deg, #6aa7ff, #4a6cff, #8a6aff);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f8fc;
          --card: #ffffff;
          --text: #0b1020;
          --muted: #577199;
          --accent: #2d6cff;
          --ring: #2d6cff33;
          --gradient: linear-gradient(135deg, #2d6cff, #6a5cff, #8a2dff);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu,
          Cantarell, Noto Sans, sans-serif;
        background: var(--bg);
        background: radial-gradient(
            1200px 800px at 80% -10%,
            #1a2447 0%,
            transparent 70%
          ),
          radial-gradient(1200px 800px at 0% 110%, #1b2b52 0%, transparent 65%),
          var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .demo-wrap {
        width: min(900px, 100%);
      }

      .profile-card {
        background: var(--card);
        border-radius: 1.5rem;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35),
          0 1px 0 rgba(255, 255, 255, 0.04) inset;
        padding: clamp(1rem, 2vw + 0.5rem, 2rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        position: relative;
        overflow: hidden;
      }
      .profile-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 8px;
        background: var(--gradient);
      }

      @media (min-width: 600px) {
        .profile-card {
          display: grid;
          grid-template-columns: auto 1fr;
          grid-template-rows: auto auto 1fr auto;
          grid-column-gap: clamp(1rem, 3vw, 2rem);
          align-items: center;
        }
        .avatar {
          grid-row: 1 / span 3;
        }
        .name {
          grid-column: 2;
        }
        .bio {
          grid-column: 2;
        }
        .actions {
          grid-column: 2;
        }
      }

      .avatar {
        width: clamp(90px, 20vw, 140px);
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid transparent;
        background: var(--gradient) padding-box;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        flex-shrink: 0;
        transition: transform 0.3s ease;
      }
      .avatar:hover {
        transform: scale(1.05);
      }
      .avatar img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .name {
        display: flex;
        flex-direction: column;
        text-align: center;
        gap: 0.3rem;
      }
      @media (min-width: 600px) {
        .name {
          text-align: left;
        }
      }
      .name h2 {
        margin: 0;
        font-size: clamp(1.3rem, 1.6vw + 1rem, 1.8rem);
        letter-spacing: 0.5px;
        background: var(--gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .name p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        justify-content: center;
        margin-top: 0.3rem;
      }
      @media (min-width: 600px) {
        .tags {
          justify-content: flex-start;
        }
      }
      .chip {
        font-size: 0.85rem;
        padding: 0.4rem 0.75rem;
        border-radius: 999px;
        background: var(--gradient);
        color: #fff;
        font-weight: 500;
        white-space: nowrap;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }

      .bio {
        color: var(--text);
        line-height: 1.6;
        font-size: clamp(1rem, 0.6vw + 0.9rem, 1.1rem);
        opacity: 0.95;
        text-align: center;
      }
      @media (min-width: 600px) {
        .bio {
          text-align: left;
        }
      }

      .actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        width: 100%;
        margin-top: 0.4rem;
      }
      @media (min-width: 600px) {
        .actions {
          justify-content: flex-start;
        }
      }

      .btn {
        appearance: none;
        border: 0;
        padding: 0.8rem 1.2rem;
        border-radius: 1rem;
        font-weight: 600;
        cursor: pointer;
        background: var(--gradient);
        color: white;
        box-shadow: 0 12px 20px var(--ring);
        transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      }
      .btn.secondary {
        background: transparent;
        color: var(--accent);
        border: 2px solid var(--accent);
      }
      .btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 16px 24px var(--ring);
      }
      .btn:active {
        transform: translateY(0);
        opacity: 0.9;
      }
      .btn:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="demo-wrap">
      <article class="profile-card" role="region" aria-label="Profile Card">
        <figure class="avatar" aria-hidden="true">
          <img src="edited.png" alt="Profile avatar" />
        </figure>

        <header class="name">
          <h2>Arnav Anand</h2>
          <p>Student · IIT Patna</p>
          <div class="tags">
            <span class="chip">UI/UX</span>
            <span class="chip">Design Systems</span>
            <span class="chip">Web Accessibility</span>
          </div>
        </header>

        <p class="bio">
          Designer focused on human‑centered products. Previously @ Amazon. I
          enjoy turning complex problems into delightful, simple interfaces.
        </p>

        <div class="actions">
          <button class="btn" type="button">Follow</button>
          <button class="btn secondary" type="button">Message</button>
        </div>
      </article>
    </main>
  </body>
</html>
